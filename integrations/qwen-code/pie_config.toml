# Portable (ggml) driver config for the qwen-code integration —
# Qwen3-0.6B on Metal (fall back to ["cpu"] if the build lacks GGML_METAL).
# Field names track the current portable-driver options schema.

[auth]
enabled = false

[[model]]
name = "default"
hf_repo = "Qwen/Qwen3-0.6B"

[model.driver]
type = "portable"
device = ["metal"]
activation_dtype = "bfloat16"

[model.driver.options]
max_forward_tokens = 4096
max_forward_requests = 16
total_pages = 512

[model.scheduler]
# Slow-driver headroom (see codex RUNPOD_HANDOVER: the 120 s default
# abandons long prefills while the driver keeps grinding).
request_timeout_secs = 600
# Bound the qwenchat/ snapshot namespace: abandoned conversations
# otherwise pin their KV pages forever (snapshots have no owner).
max_snapshots_per_prefix = 64
