[package]
name = "chat-completions"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# preserve_order: tool schemas and tool-call arguments replay through a
# jinja-tojson-style serializer (render_text::tojson) that must keep the
# sender's key order, exactly as transformers' chat templating does.
serde_json = { version = "1.0", features = ["preserve_order"] }

# The SDK only compiles for the component target; the pure modules (wire
# types, canon/hash, chunk assembly, salvage parsers) build and unit-test
# natively without it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
inferlet = { path = "../../../sdk/rust/inferlet" }
