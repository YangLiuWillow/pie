# Native CUDA driver (in-process, no Python/vLLM subprocess).
# Qwen3-Coder-30B-A3B (MoE) — cuda_native counterpart of
# pie_cuda_vllm_config_30b_moe.toml. Requires a `pie` built with
# `--features driver-portable,driver-cuda` (see build_pie_cuda.sh).
#
# NEW-SCHEMA config for the c77d91d9 worktree binary: the driver auto-plans KV
# and batch sizing from `memory_profile` + `gpu_mem_utilization`; the old
# max_num_kv_pages / max_batch_tokens / max_batch_size knobs were REMOVED and
# now make the server refuse to boot ("unknown field").
[auth]
enabled = false

[server]
verbose = true

[[model]]
name = "default"
hf_repo = "Qwen/Qwen3-Coder-30B-A3B-Instruct"

[model.driver]
type = "cuda_native"
device = ["cuda:0"]

[model.driver.options]
# ~60 GB of bf16 weights on a 96 GB RTX Pro 6000 Blackwell (gpu_rtx6000); the
# planner spends the rest of the 0.90 budget on KV pages.
gpu_mem_utilization = 0.90
memory_profile = "auto"
kv_page_size = 32
weight_dtype = "bfloat16"
# No host-backed KV offload tier here — this is the plain/base config. See
# pie_cuda_native_config_30b_moe_swap.toml for the swap-enabled variant.
swap_pool_size = 0
