[package]
name = "openhands-agent"
version = "0.1.0"
description = "CodeACT-style SWE-Bench agent with JSON-schema-constrained tool calling"
authors = ["Pie Team"]

[runtime]
core = "^0.2.0"

[parameters]
task = {type = "string", description = "The SWE-Bench problem statement / user prompt"}
tool_server_url = {type = "string", description = "URL of the tool execution server (e.g. http://127.0.0.1:PORT)"}
max_steps = {type = "int", optional = true, description = "Maximum agent steps (default: 50)"}
max_tokens_per_step = {type = "int", optional = true, description = "Max tokens per generation step (default: 16384)"}
context_token_limit = {type = "int", optional = true, description = "Context window budget in tokens; triggers condensation when approached (default: 28000)"}
max_observation_chars = {type = "int", optional = true, description = "Max characters per tool observation before truncation (default: 8000)"}
