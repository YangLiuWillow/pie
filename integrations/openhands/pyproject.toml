[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pie-openhands"
version = "0.1.0"
description = "OpenHands ↔ Pie integration (PieLLM, PieConversation, supporting inferlets)"
requires-python = ">=3.12"
dependencies = [
  "openhands-sdk==1.21.1",
  # benchmarks/swe_bench.py builds the stock agent via
  # `openhands.tools.preset.default.get_default_tools`, so this is a hard
  # runtime dependency of the harness, not an extra. Released in lockstep with
  # the sdk — keep the two versions identical.
  "openhands-tools==1.21.1",
  # `pie_openhands.llm` imports PieClient directly, so this is a hard runtime
  # dependency, not an optional extra. Published on PyPI; installing the
  # Pie repo's `client/python` in editable mode also satisfies it.
  "pie-client>=0.3",
  "pydantic>=2.7",
  "transformers>=4.46",
  "datasets>=2.20",
  "tenacity>=8.0",
  "websockets>=12",
  "msgpack>=1.0",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
bench = ["pandas>=2.2", "matplotlib>=3.9", "scipy>=1.13"]

[tool.setuptools.packages.find]
include = ["pie_openhands*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
