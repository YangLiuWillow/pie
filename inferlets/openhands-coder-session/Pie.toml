[package]
name = "openhands-coder-session"
version = "0.1.0"
description = "Stateful OpenHands ↔ Pie transport. Same contract as openhands-completion, plus persistent per-conversation KV via named contexts: each call extends the saved session snapshot when the new prompt is a token-level extension of the previous one, and rebuilds from scratch otherwise. See integrations/openhands/docs/OPENHANDS_CODER_SESSION_DESIGN.md."
authors = ["Lin Startup"]
repository = "https://github.com/pie-project/pie"
readme = "README.md"

[runtime]
core = "^0.2.0"

[parameters]
session_id        = {type = "string", optional = true, description = "Conversation identity, and the namespace of this conversation's content-addressed KV prefix cache. When set, prompt KV is reused across calls. Omit for fully stateless behavior."}
session_action    = {type = "string", optional = true, description = "'delete' deletes every KV snapshot saved under this session and exits (conversation end). Call it or the snapshots pin their pages until the engine restarts."}
kv_verify         = {type = "bool",   optional = true, description = "Assert token-level bookkeeping invariants on every call (Phase 2 fidelity mode). Errors instead of silently rebuilding on mismatch."}
max_tokens        = {type = "int",    optional = true, description = "Hard cap on generated tokens. Default 2048."}
temperature       = {type = "float",  optional = true, description = "Sampling temperature. 0 = greedy. Default 0.0."}
top_p             = {type = "float",  optional = true, description = "Nucleus sampling threshold. Default 0.95."}
use_grammar       = {type = "bool",   optional = true, description = "Constrain decoding with the native tool-call grammar. Default true. Disable for byte-parity with an unconstrained vLLM baseline."}
model             = {type = "string", optional = true, description = "Model name (informational only — the runtime's first model is used)."}
# `messages`, `tools`, and `stop` are structured arrays; the manifest TOML type
# system only supports scalar types, so they are declared implicitly — the
# inferlet's Input struct (serde) accepts and validates them at runtime.
