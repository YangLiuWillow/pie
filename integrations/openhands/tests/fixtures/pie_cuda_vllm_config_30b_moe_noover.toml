[auth]
enabled = false

[server]
verbose = true

[[model]]
name = "default"
hf_repo = "Qwen/Qwen3-Coder-30B-A3B-Instruct"

[model.driver]
type = "vllm"
device = ["cuda:0"]

[model.driver.options]
venv = "/nfs/roberts/scratch/pi_ql324/ly337/pie-vllm-env"
enforce_eager = true
gpu_memory_utilization = 0.90
max_model_len = 32768
max_num_batched_tokens = 8192

# Option A: admission gate = physical capacity (no 4x oversubscription). With
# swap disabled under the vLLM driver, this makes Pie QUEUE/refuse contexts
# beyond KV capacity instead of admitting them and OOM-crashing. Tests whether
# Pie degrades gracefully (survives, serializes) rather than dies.
[model.scheduler]
admission_oversubscription_factor = 1.0
