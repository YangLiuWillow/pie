# pie arm, H200 x Qwen3-Coder-30B-A3B-Instruct (A/B rerun on the rewritten
# engine; old-engine numbers in docs/qwen-code-integration-plan.md §5b).

[server]
host = "127.0.0.1"
port = 18080
registry = "https://registry.pie-project.org/"
verbose = false
telemetry = false

[model]
# The name is the ONLY signal the inferlet has for picking a tool-calling
# dialect: `architecture()` reports `qwen3_moe` for both the Coder and
# non-Coder MoE models, and pie does not expose the HF id. It must contain
# "coder" for a Coder deployment, or the renderer serves the hermes/JSON
# tool prompt and the model answers in prose without ever calling a tool
# (docs §11).
name = "qwen3-coder-30b-a3b"
model = "Qwen/Qwen3-Coder-30B-A3B-Instruct"

[driver]
type = "cuda_native"
device = ["cuda:0"]
tensor_parallel_size = 1
activation_dtype = "bfloat16"
gpu_mem_utilization = 0.90

[runtime]
request_timeout = "600s"
# First 30B request pays PTIR compile + warmup and can exceed the default
# 30s silence window — the engine then kills the inferlet mid-warmup.
silence_timeout = "300s"

[sandbox]
allow_fs = false
allow_network = true
network_allowed_hosts = ["*"]
