[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pie-openhistoria"
version = "0.0.1"
description = "OpenAI-compatible HTTP adapter that serves Open Historia from a Pie-hosted model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    # pie_client is installed separately from this repo (editable):
    #   pip install -e ../../client/python
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pie-openhistoria = "pie_openhistoria.__main__:main"

[tool.setuptools.packages.find]
include = ["pie_openhistoria*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
